---
- name: Install packages for ansible exam
  hosts: all
  tasks:
    - name: Installs php and mariadb packages
      ansible.builtin.dnf:
        name:
          - php
          - mariadb
        state: present
      when: inventory_hostname in groups['prod'] or inventory_hostname in groups['dev'] or inventory_hostname in groups['test']

    - name: Install Development Tools
      ansible.builtin.dnf:
        name: '@RPM Development Tools'
        state: present
      when: inventory_hostname in groups['dev']

    - name: update all packges in stage group
      ansible.builtin.dnf:
        name: '*'
        state: latest
      when: inventory_hostname in groups['stage']
